<style>

let lang = localStorage.getItem('vk_lang') || 'cz';

function fitOne(mark, desc){
  if(!mark || !desc) return;
  const ls = parseFloat(getComputedStyle(mark).letterSpacing) || 0;
  const markInk = mark.getBoundingClientRect().width - 2 * ls;
  const n = (desc.textContent || '').replace(/\s/g, '').length;
  if(!markInk || n < 2) return;
  desc.style.letterSpacing = '0px';
  desc.style.textIndent = '0px';
  const ink0 = desc.getBoundingClientRect().width;
  const track = (0.95 * markInk - ink0) / (n - 1);
  desc.style.letterSpacing = track + 'px';
  desc.style.textIndent = track + 'px';
}
function fitDescriptor(){
  fitOne(document.getElementById('markA'), document.getElementById('descA'));
  fitOne(document.getElementById('markB'), document.getElementById('descB'));
}

function renderCards(list){
  const wrap = document.getElementById('cards');
  wrap.innerHTML = '';
  list.forEach(c => {
    const el = document.createElement('article');
    el.className = 'card';
    el.innerHTML = `<span class="num">${c.num}</span><h3>${c.title}</h3><p>${c.body}</p>`;
    wrap.appendChild(el);
  });
}

function applyLang(l){
  lang = l;
  localStorage.setItem('vk_lang', l);
  document.documentElement.lang = l === 'cz' ? 'cs' : 'en';
  const t = COPY[l];
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if(t[key] !== undefined) el.textContent = t[key];
  });
  document.querySelectorAll('.slide img').forEach((img, i) => { img.alt = t.carouselAlt[i % t.carouselAlt.length]; });
  document.getElementById('carousel').setAttribute('aria-label', t.carouselLabel);
  document.getElementById('carPrev').setAttribute('aria-label', t.prevLabel);
  document.getElementById('carNext').setAttribute('aria-label', t.nextLabel);
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const key = el.getAttribute('data-i18n-html');
    if(t[key] !== undefined) el.innerHTML = t[key];
  });
  document.getElementById('descA').textContent = t.descriptor;
  document.getElementById('descB').textContent = t.descriptor;
  renderCards(t.cards);
  document.getElementById('btnCz').classList.toggle('active', l === 'cz');
  document.getElementById('btnEn').classList.toggle('active', l === 'en');
  document.title = l === 'cz'
    ? 'Kraniosakrální terapie Praha 6 — Veronika Kuncová'
    : 'Craniosacral Therapy Prague 6 — Veronika Kuncová';
  requestAnimationFrame(fitDescriptor);
}

const carTrack = document.getElementById('carouselTrack');
const carPrev = document.getElementById('carPrev');
const carNext = document.getElementById('carNext');
const carSlides = Array.from(carTrack.children);
const carCount = carSlides.length;
// Copies on both sides let touch, trackpad and arrow navigation cross either end.
function carCopies(){
  const fragment = document.createDocumentFragment();
  carSlides.forEach(slide => {
    const copy = slide.cloneNode(true);
    copy.setAttribute('aria-hidden', 'true');
    fragment.appendChild(copy);
  });
  return fragment;
}
carTrack.prepend(carCopies());
carTrack.append(carCopies());
function carStep(){
  const slide = carTrack.querySelector('.slide');
  const gap = parseFloat(getComputedStyle(carTrack).columnGap) || 18;
  return slide.getBoundingClientRect().width + gap;
}
function carJump(left){
  carTrack.style.scrollSnapType = 'none';
  carTrack.scrollTo({ left, behavior: 'instant' });
  requestAnimationFrame(() => { carTrack.style.scrollSnapType = ''; });
}
let carWidth = carStep();
carJump(carCount * carWidth);
let carTimer;
let carDragging = false;
function carNormalize(){
  if(carDragging) return;
  const cycle = carStep() * carCount;
  const left = carTrack.scrollLeft;
  if(cycle > 0 && (left < cycle - 1 || left >= 2 * cycle - 1)){
    carJump(cycle + ((left - cycle) % cycle + cycle) % cycle);
  }
}
function carMove(direction){
  carNormalize();
  const step = carStep();
  const target = (Math.round(carTrack.scrollLeft / step) + direction) * step;
  carTrack.scrollTo({ left: target, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
}
carPrev.disabled = false;
carNext.disabled = false;
carPrev.addEventListener('click', () => carMove(-1));
carNext.addEventListener('click', () => carMove(1));
carTrack.addEventListener('keydown', event => {
  if(event.key === 'ArrowLeft' || event.key === 'ArrowRight'){
    event.preventDefault();
    carMove(event.key === 'ArrowLeft' ? -1 : 1);
  }
});
carTrack.addEventListener('pointerdown', () => { carDragging = true; });
function carRelease(){
  carDragging = false;
  clearTimeout(carTimer);
  carTimer = setTimeout(carNormalize, 160);
}
window.addEventListener('pointerup', carRelease);
window.addEventListener('pointercancel', carRelease);
carTrack.addEventListener('scroll', () => {
  clearTimeout(carTimer);
  carTimer = setTimeout(carNormalize, 160);
}, { passive: true });
carTrack.addEventListener('scrollend', carNormalize);
window.addEventListener('resize', () => {
  const index = Math.round(carTrack.scrollLeft / carWidth) % carCount;
  carWidth = carStep();
  carJump((carCount + index) * carWidth);
});

document.getElementById('btnCz').addEventListener('click', () => applyLang('cz'));
document.getElementById('btnEn').addEventListener('click', () => applyLang('en'));

const burger = document.getElementById('burger');
const navPrimary = document.getElementById('navPrimary');
burger.addEventListener('click', () => {

contactForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const submitBtn = contactForm.querySelector('button[type="submit"]');
  const originalLabel = submitBtn.textContent;
  submitBtn.disabled = true;
  try {
    const response = await fetch(contactForm.action, {
      method: 'POST',
      body: new FormData(contactForm),
      headers: { 'Accept': 'application/json' }
    });
    if (response.ok) {
      document.getElementById('formFields').style.display = 'none';
      document.getElementById('sentMsg').classList.add('show');
      contactForm.reset();
    } else {
      alert(lang === 'cz'
        ? 'Zprávu se nepodařilo odeslat. Zkuste to prosím znovu, nebo mi napište přímo na jsem@veronikakuncova.cz.'
        : 'Something went wrong sending your message. Please try again, or email me directly at jsem@veronikakuncova.cz.');

    alert(lang === 'cz'
      ? 'Zprávu se nepodařilo odeslat. Zkuste to prosím znovu, nebo mi napište přímo na jsem@veronikakuncova.cz.'

  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = originalLabel;

});
